<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- templates/fragments/sidebar.html
     Uso en cada página:  th:replace="~{fragments/sidebar :: sidebar('orders')}"
     El parámetro es la opción del menú que queda activa.
     Necesita base.css + panel.css en la página que lo incluye. -->
<aside class="sidebar" th:fragment="sidebar(active)">

    <!-- Engranajes decorativos y tenues -->
    <svg class="gears" viewBox="0 0 260 800" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <symbol id="gear" viewBox="0 0 200 200">
                <g fill="#AE9DCC">
                    <circle cx="100" cy="100" r="62" fill="none" stroke="#AE9DCC" stroke-width="26"/>
                    <rect id="gear-tooth" x="87" y="14" width="26" height="36" rx="3"/>
                    <use href="#gear-tooth" transform="rotate(30 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(60 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(90 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(120 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(150 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(180 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(210 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(240 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(270 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(300 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(330 100 100)"/>
                </g>
            </symbol>
        </defs>
        <use href="#gear" x="-60" y="380" width="260" height="260"/>
        <use href="#gear" x="150" y="330" width="130" height="130"/>
        <use href="#gear" x="110" y="600" width="220" height="220"/>
        <use href="#gear" x="10" y="660" width="90" height="90"/>
    </svg>

    <!-- El logo lleva a la página principal del rol (la misma del login) -->
    <a class="brand" href="../repairs/list.html" hx-boost="true"
       th:href="${#authorization.expression('hasRole(''MECHANIC'')')} ? @{/repairs/assigned} : @{/repairs}">
        <span class="brand-icon">
            <img src="../../static/images/logo-taller.png" th:src="@{/images/logo-taller.png}" alt="">
        </span>
        <span class="brand-name">Autogest</span>
    </a>

    <div class="workspace-chip">
        <strong>Taller Autogest</strong>
        <small>Sede Tunja · Boyacá</small>
    </div>

    <div class="sidebar-section-title">ESPACIO DE TRABAJO</div>

    <!-- MENÚ POR ROL
         sec:authorize  -> Spring borra los enlaces que no son del rol con sesión
                           (solo oculta: la protección real está en SecurityConfig).
         th:class       -> marca la opción activa según el parámetro "active".
         hx-boost       -> todas las vistas del panel cargan el mismo <head>
                           (fragments/head :: head(..., 'panel')), así que HTMX solo
                           cambia el <body> al navegar, sin recargar CSS ni scripts. -->
    <nav class="menu" aria-label="Menú principal" hx-boost="true">

        <!-- 1. OPERADOR y ADMIN: órdenes y recepción vehicular -->
        <a href="../repairs/list.html" th:href="@{/repairs}"
           sec:authorize="hasAnyRole('OPERATOR', 'ADMIN')"
           class="menu-item"
           th:class="${active == 'orders'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="clipboard-list"></i> Órdenes de servicio
        </a>
        <a href="../vehicles/list.html" th:href="@{/vehicles}"
           sec:authorize="hasAnyRole('OPERATOR', 'ADMIN')"
           class="menu-item"
           th:class="${active == 'vehicles'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="car"></i> Recepción vehicular
        </a>

        <!-- 2. MECÁNICO -->
        <a href="../repairs/assigned.html" th:href="@{/repairs/assigned}"
           sec:authorize="hasRole('MECHANIC')"
           class="menu-item"
           th:class="${active == 'assigned'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="wrench"></i> Mis reparaciones
        </a>

        <!-- 3. ADMINISTRADOR -->
        <a href="../spare-parts/list.html" th:href="@{/spare-parts}"
           sec:authorize="hasRole('ADMIN')"
           class="menu-item"
           th:class="${active == 'spare-parts'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="package"></i> Inventario de repuestos
        </a>
        <a href="../car-models/list.html" th:href="@{/car-models}"
           sec:authorize="hasRole('ADMIN')"
           class="menu-item"
           th:class="${active == 'car-models'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="layers"></i> Catálogo de modelos
        </a>
        <a href="../users/list.html" th:href="@{/users}"
           sec:authorize="hasRole('ADMIN')"
           class="menu-item"
           th:class="${active == 'users'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="users"></i> Usuarios y roles
        </a>
    </nav>

    <div class="sidebar-bottom">
        <a href="../account/change-password.html" th:href="@{/account/password}"
           hx-boost="true"
           class="help-link"
           th:class="${active == 'account'} ? 'help-link active' : 'help-link'">
            <i data-lucide="key-round"></i> Cambiar mi contraseña
        </a>

        <!-- Logout con POST (Spring Security); th:action agrega el token CSRF.
             Sin hx-boost: /login tiene otro <head> (login.css) y debe cargarse completo. -->
        <form method="post" action="#" th:action="@{/logout}">
            <button type="submit" class="help-link">
                <i data-lucide="log-out"></i> Cerrar sesión
            </button>
        </form>

        <!-- Usuario de la sesión: nombre completo e iniciales (ej. "Carlos Mejía" -> "CM").
             Usa el mismo "currentUserName" del saludo (ver fragments/header.html :: welcome);
             mientras el backend no lo envíe, muestra el nombre de usuario con que inició sesión. -->
        <div class="user-profile-footer"
             th:with="displayName=${currentUserName != null ? currentUserName : #authentication.name},
                      words=${#strings.arraySplit(displayName, ' ')}">
            <div class="avatar-circle" aria-hidden="true"
                 th:text="${#strings.toUpperCase(#strings.substring(words[0], 0, 1)
                          + (#arrays.length(words) > 1 ? #strings.substring(words[#arrays.length(words) - 1], 0, 1) : ''))}">CM</div>
            <div class="user-info">
                <strong th:text="${displayName}" th:title="${displayName}">Carlos Mejía</strong>
                <small sec:authorize="hasRole('ADMIN')">Administrador</small>
                <small sec:authorize="hasRole('MECHANIC')">Mecánico</small>
                <small sec:authorize="hasRole('OPERATOR')">Operador</small>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
