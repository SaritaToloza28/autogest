<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- templates/fragments/sidebar.html
     Uso en cada página:  th:replace="~{fragments/sidebar :: sidebar('orders')}"
     El parámetro es la opción del menú que queda activa. -->
<aside class="sidebar" th:fragment="sidebar(active)">

    <!-- Engranajes decorativos y tenues -->
    <svg class="gears" viewBox="0 0 260 800" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <symbol id="gear" viewBox="0 0 200 200">
                <g fill="#AE9DCC">
                    <circle cx="100" cy="100" r="62" fill="none" stroke="#AE9DCC" stroke-width="26"/>
                    <rect id="gear-tooth" x="87" y="14" width="26" height="36" rx="3"/>
                    <use href="#gear-tooth" transform="rotate(30 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(60 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(90 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(120 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(150 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(180 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(210 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(240 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(270 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(300 100 100)"/>
                    <use href="#gear-tooth" transform="rotate(330 100 100)"/>
                </g>
            </symbol>
        </defs>
        <use href="#gear" x="-60" y="380" width="260" height="260"/>
        <use href="#gear" x="150" y="330" width="130" height="130"/>
        <use href="#gear" x="110" y="600" width="220" height="220"/>
        <use href="#gear" x="10" y="660" width="90" height="90"/>
    </svg>

    <a class="brand" href="#" th:href="@{/repairs/dashboard}">
        <span class="brand-icon"><i data-lucide="cog"></i></span>
        <span class="brand-name">Autogest</span>
    </a>

    <div class="workspace-chip">
        <strong>Taller Autogest</strong>
        <small>Sede Chapinero · Bogotá</small>
    </div>

    <div class="sidebar-section-title">ESPACIO DE TRABAJO</div>

    <!-- MENÚ POR ROL
         sec:authorize  -> Spring borra los enlaces que no son del rol con sesión.
         th:class       -> marca la opción activa según el parámetro "active".
         hx-boost       -> HTMX navega sin recargar toda la página. -->
    <nav class="menu" aria-label="Menú principal" hx-boost="true">

        <!-- 1. OPERADOR -->
        <a href="../repairs/dashboard.html" th:href="@{/repairs/dashboard}"
           sec:authorize="hasRole('OPERATOR')"
           class="menu-item"
           th:class="${active == 'orders'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="clipboard-list"></i> Órdenes de servicio
        </a>
        <a href="../vehicles/list.html" th:href="@{/vehicles}"
           sec:authorize="hasRole('OPERATOR')"
           class="menu-item"
           th:class="${active == 'vehicles'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="car"></i> Recepción vehicular
        </a>

        <!-- 2. MECÁNICO -->
        <a href="#" th:href="@{/repairs/assigned}"
           sec:authorize="hasRole('MECHANIC')"
           class="menu-item"
           th:class="${active == 'assigned'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="wrench"></i> Mis reparaciones
        </a>
        <a href="#" th:href="@{/spare-parts/compatible}"
           sec:authorize="hasRole('MECHANIC')"
           class="menu-item"
           th:class="${active == 'compatible'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="search"></i> Buscar repuestos
        </a>

        <!-- 3. ADMINISTRADOR -->
        <a href="#" th:href="@{/spare-parts}"
           sec:authorize="hasRole('ADMINISTRATOR')"
           class="menu-item"
           th:class="${active == 'spare-parts'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="package"></i> Inventario de repuestos
        </a>
        <a href="#" th:href="@{/car-models}"
           sec:authorize="hasRole('ADMINISTRATOR')"
           class="menu-item"
           th:class="${active == 'car-models'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="layers"></i> Catálogo de modelos
        </a>
        <a href="#" th:href="@{/users}"
           sec:authorize="hasRole('ADMINISTRATOR')"
           class="menu-item"
           th:class="${active == 'users'} ? 'menu-item active' : 'menu-item'">
            <i data-lucide="users"></i> Usuarios y roles
        </a>
    </nav>

    <div class="sidebar-bottom">
        <!-- Logout con POST (Spring Security), fuera del menú -->
        <form method="post" action="#" th:action="@{/logout}">
            <button type="submit" class="help-link">
                <i data-lucide="log-out"></i> Cerrar sesión
            </button>
        </form>

        <div class="user-profile-footer">
            <div class="avatar-circle"
                 th:text="${#strings.toUpperCase(#strings.substring(#authentication.name, 0, 1))}">LR</div>
            <div class="user-info">
                <strong sec:authentication="name">Laura Rodríguez</strong>
                <small sec:authorize="hasRole('ADMINISTRATOR')">Administrador</small>
                <small sec:authorize="hasRole('MECHANIC')">Mecánico</small>
                <small sec:authorize="hasRole('OPERATOR')">Operador</small>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
