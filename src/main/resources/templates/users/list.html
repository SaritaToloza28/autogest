<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="../../static/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
</head>
<body hx-headers='{"X-CSRF-TOKEN": "estatico"}'
      th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

<div id="toast-container"></div>

<main class="container">
    <div class="actions">
        <a class="btn" href="../account/change-password.html" th:href="@{/account/password}">Cambiar mi contraseña</a>
        <form method="post" action="/logout" th:action="@{/logout}">
            <button type="submit" class="btn">Cerrar sesión</button>
        </form>
    </div>

    <h1>Usuarios</h1>

    <form id="user-form" class="card" th:fragment="user-form" method="post"
          hx-post="/users"
          th:hx-post="${appUserId == null} ? @{/users}"
          th:hx-put="${appUserId != null} ? @{/users/{id}(id=${appUserId})}"
          hx-target="this"
          hx-swap="outerHTML">

        <h2 th:text="${appUserId == null} ? 'Nuevo usuario' : 'Editar usuario'">Nuevo usuario</h2>

        <div class="form-grid">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" maxlength="50" required
                       value="" th:value="${appUser.username}">
            </div>

            <div class="field">
                <label for="fullName">Nombre completo</label>
                <input id="fullName" type="text" name="fullName" maxlength="100" required
                       value="" th:value="${appUser.fullName}">
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" maxlength="72"
                       placeholder="Mínimo 8 caracteres"
                       th:placeholder="${appUserId == null} ? 'Mínimo 8 caracteres' : 'Vacío = conservar la actual'"
                       th:required="${appUserId == null}">
            </div>

            <div class="field">
                <label for="role">Rol</label>
                <select id="role" name="role" required>
                    <option value="">Seleccione...</option>
                    <option th:each="r : ${roles}"
                            th:value="${r}"
                            th:text="${r}"
                            th:selected="${r == appUser.role}">ADMIN</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${appUserId == null} ? 'Guardar' : 'Actualizar'">Guardar</button>

            <button type="button" class="btn" th:if="${appUserId != null}"
                    hx-get="/users/form"
                    th:hx-get="@{/users/form}"
                    hx-target="#user-form"
                    hx-swap="outerHTML">Cancelar</button>
        </div>
    </form>

    <table id="user-table" class="card table" th:fragment="user-table" hx-swap-oob="true">
        <thead>
        <tr>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="u : ${appUsers}">
            <td th:text="${u.username}">admin</td>
            <td th:text="${u.fullName}">Administrador</td>
            <td th:text="${u.role}">ADMIN</td>
            <td class="actions">
                <button type="button" class="btn"
                        hx-get="/users/1/edit"
                        th:hx-get="@{/users/{id}/edit(id=${u.id})}"
                        hx-target="#user-form"
                        hx-swap="outerHTML">Editar</button>

                <button type="button" class="btn btn-danger"
                        hx-delete="/users/1"
                        th:hx-delete="@{/users/{id}(id=${u.id})}"
                        hx-swap="none"
                        hx-confirm="¿Eliminar este usuario?"
                        th:hx-confirm="|¿Eliminar a ${u.fullName}?|">Eliminar</button>
            </td>
        </tr>

        <tr th:remove="all">
            <td>mecanico1</td>
            <td>Juan Pérez</td>
            <td>MECHANIC</td>
            <td class="actions">
                <button type="button" class="btn">Editar</button>
                <button type="button" class="btn btn-danger">Eliminar</button>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(appUsers)}">
            <td colspan="4" class="empty">No hay usuarios registrados</td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
