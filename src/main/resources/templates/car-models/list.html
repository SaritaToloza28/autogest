<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Catálogo de modelos', 'panel')}">
    <!-- Solo para la vista previa sin Spring (ver fragments/head.html) -->
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../static/images/logo-taller.png">
    <title>Catálogo de modelos | Autogest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/panel.css">
    <script defer src="../../static/js/htmx.min.js"></script>
    <script defer src="../../static/js/lucide.min.js"></script>
    <script defer src="../../static/js/panel.js"></script>
</head>

<body class="dashboard-body preview-admin">

<!-- Notificaciones (fragments/toast.html las agrega aquí) -->
<div id="toast-container" role="status" aria-live="polite"></div>

<div class="app-shell">

    <aside class="sidebar"
           th:replace="~{fragments/sidebar :: sidebar('car-models')}"
           hx-get="../fragments/sidebar.html"
           hx-select=".sidebar"
           hx-trigger="load"
           hx-swap="outerHTML"></aside>

    <main id="main-content" class="main-content">

        <header class="top-header">
            <!-- Saludo según la hora: Spring lo reemplaza por fragments/header :: welcome -->
            <div class="welcome"
                 th:replace="~{fragments/header :: welcome}"
                 hx-get="../fragments/header.html"
                 hx-select=".welcome"
                 hx-trigger="load"
                 hx-swap="outerHTML"></div>
            <div class="header-right">
                <!-- Rol de la sesión: fragments/header :: role -->
                <span class="role-badge"
                      th:replace="~{fragments/header :: role}"
                      hx-get="../fragments/header.html"
                      hx-select=".role-badge"
                      hx-trigger="load"
                      hx-swap="outerHTML"></span>
            </div>
        </header>

        <section class="page-title-section">
            <div>
                <span class="subtitle">ADMINISTRACIÓN</span>
                <h1>Catálogo de modelos</h1>
                <p class="subtitle">Marcas y modelos que atiende el taller. Se usan en vehículos y repuestos compatibles.</p>
            </div>
        </section>

        <!-- Formulario: crear y editar (car-models/response lo devuelve con el toast) -->
        <form id="car-model-form" class="card form-card" th:fragment="form"
              hx-post="/car-models"
              th:hx-post="${carModelId == null} ? @{/car-models}"
              th:hx-put="${carModelId != null} ? @{/car-models/{id}(id=${carModelId})}"
              hx-target="this"
              hx-swap="outerHTML">

            <div class="form-card-header">
                <h2 th:text="${carModelId == null} ? 'Nuevo modelo' : 'Editar modelo'">Nuevo modelo</h2>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="brand">Marca</label>
                    <input id="brand" type="text" name="brand" maxlength="60" required
                           placeholder="Mazda"
                           value="" th:value="${carModel.brand}">
                </div>

                <div class="field">
                    <label for="name">Modelo</label>
                    <input id="name" type="text" name="name" maxlength="60" required
                           placeholder="CX-5"
                           value="" th:value="${carModel.name}">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-outline" th:if="${carModelId != null}"
                        hx-get="/car-models/form"
                        th:hx-get="@{/car-models/form}"
                        hx-target="#car-model-form"
                        hx-swap="outerHTML">Cancelar</button>

                <button type="submit" class="btn btn-primary">
                    <i data-lucide="save"></i>
                    <span th:text="${carModelId == null} ? 'Guardar' : 'Actualizar'">Guardar</span>
                </button>
            </div>
        </form>

        <!-- Tabla (vuelve con hx-swap-oob después de guardar o eliminar) -->
        <section class="table-container card" aria-label="Modelos de vehículo">
            <table id="car-model-table" class="custom-table static-rows editable-table" th:fragment="table"
                   th:hx-swap-oob="${oob} ? 'true'">
                <thead>
                <tr>
                    <th scope="col">Marca</th>
                    <th scope="col">Modelo</th>
                    <th scope="col"><span class="sr-only">Acciones</span></th>
                </tr>
                </thead>

                <tbody>
                <!-- Tabla editable: cada fila tiene dos versiones.
                       · "row"      -> modo lectura (aquí y sola como "car-models/list :: row", modelo en "m").
                       · "row-edit" -> marca y modelo en campos (solo sola como "car-models/list :: row-edit").
                     El lápiz o el doble clic en una celda pide "row-edit"; Guardar (Enter) hace PUT
                     y Cancelar (Esc) vuelve a la fila sin guardar (panel.js pregunta si hubo cambios). -->
                <th:block th:each="m : ${carModels}">
                    <tr th:fragment="row" data-id="1" th:data-id="${m.id}"
                        title="Doble clic en una celda para editar">
                        <td data-field="brand"><strong th:text="${m.brand}">Mazda</strong></td>
                        <td data-field="name" th:text="${m.name}">3</td>
                        <td>
                            <div class="row-actions">
                                <button type="button" class="btn btn-outline btn-sm btn-icon"
                                        title="Editar en la tabla" aria-label="Editar en la tabla"
                                        data-row-edit
                                        hx-get="/car-models/1/row/edit"
                                        th:hx-get="@{/car-models/{id}/row/edit(id=${m.id})}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML">
                                    <i data-lucide="pencil"></i>
                                </button>

                                <button type="button" class="btn btn-danger-soft btn-sm btn-icon"
                                        title="Eliminar" aria-label="Eliminar"
                                        hx-delete="/car-models/1"
                                        th:hx-delete="@{/car-models/{id}(id=${m.id})}"
                                        hx-swap="none"
                                        hx-confirm="¿Eliminar este modelo?"
                                        th:hx-confirm="|¿Eliminar ${m.brand} ${m.name}?|">
                                    <i data-lucide="trash-2"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </th:block>

                <!-- Fila en modo edición: Spring nunca la pinta aquí (th:if false) -->
                <th:block th:if="${false}">
                    <tr th:fragment="row-edit" class="is-editing" data-id="2" th:data-id="${m.id}">
                        <td>
                            <input class="cell-input" type="text" name="brand" maxlength="60" required
                                   aria-label="Marca" value="Chevrolet" th:value="${m.brand}">
                        </td>
                        <td>
                            <input class="cell-input" type="text" name="name" maxlength="60" required
                                   aria-label="Modelo" value="Spark GT" th:value="${m.name}">
                        </td>
                        <td>
                            <div class="row-actions">
                                <button type="button" class="btn btn-success btn-sm"
                                        title="Guardar (Enter)"
                                        data-row-save
                                        hx-put="/car-models/2/row"
                                        th:hx-put="@{/car-models/{id}/row(id=${m.id})}"
                                        hx-include="closest tr"
                                        hx-validate="true"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML">
                                    <i data-lucide="check"></i> Guardar
                                </button>
                                <button type="button" class="btn btn-outline btn-sm"
                                        title="Cancelar (Esc)"
                                        data-row-cancel
                                        hx-get="/car-models/2/row"
                                        th:hx-get="@{/car-models/{id}/row(id=${m.id})}"
                                        hx-target="closest tr"
                                        hx-swap="outerHTML">
                                    Cancelar
                                </button>
                            </div>
                        </td>
                    </tr>
                </th:block>

                <!-- Fila de ejemplo: solo en la vista estática, Spring la elimina -->
                <tr th:remove="all">
                    <td><strong>Chevrolet</strong></td>
                    <td>Spark</td>
                    <td>
                        <div class="row-actions">
                            <button type="button" class="btn btn-outline btn-sm btn-icon" aria-label="Editar en la tabla"><i data-lucide="pencil"></i></button>
                            <button type="button" class="btn btn-danger-soft btn-sm btn-icon" aria-label="Eliminar"><i data-lucide="trash-2"></i></button>
                        </div>
                    </td>
                </tr>

                <tr class="empty-row" th:if="${#lists.isEmpty(carModels)}">
                    <td colspan="3">No hay modelos registrados</td>
                </tr>
                </tbody>
            </table>

            <!-- Pista: el CSS la muestra solo mientras hay una fila en edición -->
            <p class="edit-hint" aria-live="polite">
                <i data-lucide="info"></i>
                Pulsa <kbd>Enter</kbd> para guardar o <kbd>Esc</kbd> para cancelar.
            </p>
        </section>

    </main>
</div>

</body>
</html>
