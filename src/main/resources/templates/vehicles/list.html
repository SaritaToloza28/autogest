<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehículos | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        //Al hacer clic en un resultado del buscador: guarda el id, muestra el nombre y cierra la lista
        function selectCarModel(button) {
            const form = button.closest('form');
            form.querySelector('[name="carModelId"]').value = button.dataset.id;
            form.querySelector('[name="text"]').value = button.dataset.label;
            document.getElementById('car-model-results').innerHTML = '';
        }

        //Cierra la lista si se hace clic fuera del buscador
        document.addEventListener('click', function (event) {
            const results = document.getElementById('car-model-results');

            if (results && !event.target.closest('.autocomplete')) {
                results.innerHTML = '';
            }
        });
    </script>
</head>
<body hx-headers='{"X-CSRF-TOKEN": "estatico"}'
      th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

<div id="toast-container"></div>

<main class="container">
    <h1>Vehículos</h1>

    <form id="vehicle-form" class="card" th:fragment="form"
          hx-post="/vehicles"
          th:hx-post="${vehicleId == null} ? @{/vehicles}"
          th:hx-put="${vehicleId != null} ? @{/vehicles/{id}(id=${vehicleId})}"
          hx-target="this"
          hx-swap="outerHTML">

        <h2 th:text="${vehicleId == null} ? 'Nuevo vehículo' : 'Editar vehículo'">Nuevo vehículo</h2>

        <div class="form-grid">
            <div class="field">
                <label for="plateColor">Color de placa</label>
                <select id="plateColor" name="plateColor" required>
                    <option value="">Seleccione…</option>
                    <option th:each="c : ${plateColors}"
                            value="COLOR_YELLOW"
                            th:value="${c}"
                            th:text="|${c.label} — ej. ${c.example}|"
                            th:selected="${c == vehicle.plateColor}">Amarilla (particular) — ej. ABC-123</option>
                </select>
            </div>

            <div class="field">
                <label for="licensePlate">Placa</label>
                <input id="licensePlate" class="uppercase" type="text" name="licensePlate"
                       maxlength="10" required placeholder="ABC-123"
                       value="" th:value="${vehicle.licensePlate}">
            </div>

            <div class="field">
                <label for="ownerName">Propietario</label>
                <input id="ownerName" type="text" name="ownerName" maxlength="100" required
                       value="" th:value="${vehicle.ownerName}">
            </div>

            <div class="field">
                <label for="ownerPhone">Celular del propietario</label>
                <input id="ownerPhone" type="tel" name="ownerPhone" maxlength="16" required
                       inputmode="numeric" placeholder="3001234567"
                       value="" th:value="${vehicle.ownerPhone}">
            </div>

            <div class="field autocomplete">
                <label for="carModelSearch">Modelo</label>
                <!-- Buscador: mientras se escribe, el servidor devuelve los modelos que coinciden.
                     Si se vuelve a escribir, se borra el modelo elegido hasta escoger otro. -->
                <input id="carModelSearch" type="search" name="text" autocomplete="off"
                       placeholder="Escribe marca o modelo, ej. mazda 3"
                       value="" th:value="${carModelLabel}"
                       hx-get="/vehicles/car-models/search"
                       th:hx-get="@{/vehicles/car-models/search}"
                       hx-trigger="input changed delay:300ms, focus"
                       hx-target="#car-model-results"
                       hx-swap="outerHTML"
                       oninput="this.form.carModelId.value = ''">

                <!-- Lo que realmente se envía: el id del modelo elegido -->
                <input type="hidden" name="carModelId" value="" th:value="${vehicle.carModelId}">

                <div id="car-model-results" class="autocomplete-results" th:fragment="car-model-results">
                    <p class="empty" th:if="${carModels != null and #lists.isEmpty(carModels)}">
                        No hay modelos que coincidan
                    </p>

                    <button type="button" th:each="m : ${carModels}"
                            th:data-id="${m.id}"
                            th:data-label="|${m.brand} ${m.name}|"
                            th:text="|${m.brand} ${m.name}|"
                            onclick="selectCarModel(this)">Mazda 3</button>
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${vehicleId == null} ? 'Guardar' : 'Actualizar'">Guardar</button>

            <button type="button" class="btn" th:if="${vehicleId != null}"
                    hx-get="/vehicles/form"
                    th:hx-get="@{/vehicles/form}"
                    hx-target="#vehicle-form"
                    hx-swap="outerHTML">Cancelar</button>
        </div>
    </form>

    <div class="table-wrap">
        <table id="vehicle-table" class="card table" th:fragment="table" hx-swap-oob="true">
            <thead>
            <tr>
                <th>Placa</th>
                <th>Tipo</th>
                <th>Propietario</th>
                <th>Celular</th>
                <th>Modelo</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="v : ${vehicles}">
                <td>
                    <span class="plate plate-COLOR_YELLOW"
                          th:classappend="${'plate-' + v.plateColor}"
                          th:text="${v.licensePlate}">ABC-123</span>
                </td>
                <td th:text="${v.plateColor.label}">Amarilla (particular)</td>
                <td th:text="${v.ownerName}">Juan Pérez</td>
                <td class="mono" th:text="${v.ownerPhone}">3001234567</td>
                <td th:text="|${v.carModel.brand} ${v.carModel.name}|">Mazda 3</td>
                <td class="actions">
                    <button type="button" class="btn"
                            hx-get="/vehicles/1/edit"
                            th:hx-get="@{/vehicles/{id}/edit(id=${v.id})}"
                            hx-target="#vehicle-form"
                            hx-swap="outerHTML">Editar</button>

                    <button type="button" class="btn btn-danger"
                            hx-delete="/vehicles/1"
                            th:hx-delete="@{/vehicles/{id}(id=${v.id})}"
                            hx-swap="none"
                            hx-confirm="¿Eliminar este vehículo?"
                            th:hx-confirm="|¿Eliminar el vehículo ${v.licensePlate}?|">Eliminar</button>
                </td>
            </tr>

            <tr th:remove="all">
                <td><span class="plate plate-COLOR_BLUE">CD-1234</span></td>
                <td>Azul (diplomático)</td>
                <td>Embajada</td>
                <td class="mono">3109876543</td>
                <td>Toyota Prado</td>
                <td class="actions">
                    <button type="button" class="btn">Editar</button>
                    <button type="button" class="btn btn-danger">Eliminar</button>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(vehicles)}">
                <td colspan="6" class="empty">No hay vehículos registrados</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
