<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consultar mi reparación | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="../../static/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
</head>
<body class="auth-page">

<main class="card auth-card">
    <h1 class="brand">Autogest</h1>
    <p class="subtitle">Consulta el estado de la reparación de tu vehículo</p>

    <!-- GET: no modifica datos, así que no necesita token CSRF -->
    <form hx-get="/repair-status/search"
          th:hx-get="@{/repair-status/search}"
          hx-target="#results"
          hx-swap="outerHTML">
        <div class="field">
            <label for="licensePlate">Placa</label>
            <input id="licensePlate" class="uppercase" type="text" name="licensePlate"
                   maxlength="10" required placeholder="ABC-123">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Consultar</button>
    </form>

    <!-- "repairs" son RepairStatusDTO: solo datos de la reparación, nada del propietario ni del mecánico -->
    <div id="results" th:fragment="results">
        <p class="empty" th:if="${message != null}" th:text="${message}">Escribe la placa del vehículo</p>

        <p class="empty" th:if="${repairs != null and #lists.isEmpty(repairs)}">
            No encontramos reparaciones para esa placa
        </p>

        <table class="table" th:if="${repairs != null and !#lists.isEmpty(repairs)}">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Vehículo</th>
                <th>Motivo</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${repairs}">
                <td th:text="${#temporals.format(r.repairDate, 'dd/MM/yyyy')}">20/10/2026</td>
                <td th:text="|${r.licensePlate} — ${r.carModelName}|">ABC-123 — Mazda 3</td>
                <td th:text="${r.reason}">Revisión de frenos</td>
                <td><span class="tag" th:text="${r.statusLabel}">Pendiente</span></td>
            </tr>
            </tbody>
        </table>
    </div>

    <a class="link" href="index.html" th:href="@{/}">Volver al inicio</a>
</main>

</body>
</html>
