<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión', 'login')}">
    <!-- Solo para la vista previa sin Spring (ver fragments/head.html) -->
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../static/images/logo-taller.png">
    <title>Iniciar sesión | Autogest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/login.css">
</head>
<body class="auth-page">

<!-- Mensajes de Spring Security: /login?error y /login?logout -->
<div id="toast-container" role="status" aria-live="polite">
    <!-- toast-static: el error se queda visible (no se oculta a los 4 s) -->
    <div class="toast toast-error toast-static" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos</div>
    <div class="toast toast-success" th:if="${param.logout}">Sesión cerrada correctamente</div>
</div>

<div class="auth-shell">
    <main class="auth-card">

        <!-- Engranajes decorativos (un solo símbolo reutilizado, color #AE9DCC) -->
        <svg class="gears" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <symbol id="gear" viewBox="0 0 200 200">
                    <g fill="#AE9DCC">
                        <circle cx="100" cy="100" r="62" fill="none" stroke="#AE9DCC" stroke-width="26"/>
                        <rect id="gear-tooth" x="87" y="14" width="26" height="36" rx="3"/>
                        <use href="#gear-tooth" transform="rotate(30 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(60 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(90 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(120 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(150 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(180 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(210 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(240 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(270 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(300 100 100)"/>
                        <use href="#gear-tooth" transform="rotate(330 100 100)"/>
                    </g>
                </symbol>
            </defs>

            <g opacity="0.32">
                <use href="#gear" x="40" y="-40" width="230" height="230" transform="rotate(10 155 75)"/>
                <use href="#gear" x="255" y="10" width="120" height="120" transform="rotate(-8 315 70)"/>
                <use href="#gear" x="318" y="115" width="80" height="80" opacity="0.8"/>
                <use href="#gear" x="80" y="140" width="300" height="300" transform="rotate(-12 230 290)"/>
                <use href="#gear" x="320" y="215" width="130" height="130"/>
                <use href="#gear" x="-5" y="300" width="140" height="140" transform="rotate(15 65 370)"/>
                <use href="#gear" x="220" y="380" width="260" height="260" transform="rotate(8 350 510)"/>
                <use href="#gear" x="-60" y="430" width="230" height="230" transform="rotate(-10 55 545)"/>
                <use href="#gear" x="100" y="500" width="90" height="90"/>
            </g>
        </svg>

        <div class="auth-content">
            <img class="auth-logo" src="../../static/images/logo-taller.png"
                 th:src="@{/images/logo-taller.png}" alt="">
            <h1 class="brand">Autogest</h1>
            <p class="subtitle">Bienvenido de vuelta</p>

            <div class="user-avatar-header">
                <div class="avatar-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#8034D2" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

            <p class="subtitle">Ingresa con tu usuario</p>

            <!-- Envío normal (sin HTMX): Spring Security responde con una redirección
                 según el rol (SecurityConfig). th:action agrega el token CSRF. -->
            <form id="login-form" method="post" action="/login" th:action="@{/login}">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" type="text" name="username" maxlength="50"
                           required autocomplete="username" autofocus>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" type="password" name="password"
                           required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <a href="../public/index.html" th:href="@{/}" class="link-back">Volver al inicio</a>
        </div>
    </main>
</div>

</body>
</html>
