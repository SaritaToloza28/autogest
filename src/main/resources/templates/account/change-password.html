<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Cambiar contraseña', 'panel')}">
    <!-- Solo para la vista previa sin Spring (ver fragments/head.html) -->
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../static/images/logo-taller.png">
    <title>Cambiar contraseña | Autogest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../../static/css/base.css">
    <link rel="stylesheet" href="../../static/css/panel.css">
    <script defer src="../../static/js/htmx.min.js"></script>
    <script defer src="../../static/js/lucide.min.js"></script>
    <script defer src="../../static/js/panel.js"></script>
</head>

<body class="dashboard-body preview-operator">

<!-- Notificaciones (fragments/toast.html las agrega aquí) -->
<div id="toast-container" role="status" aria-live="polite"></div>

<div class="app-shell">

    <!-- Página común a los tres roles: el sidebar muestra el menú de quien tenga la sesión -->
    <aside class="sidebar"
           th:replace="~{fragments/sidebar :: sidebar('account')}"
           hx-get="../fragments/sidebar.html"
           hx-select=".sidebar"
           hx-trigger="load"
           hx-swap="outerHTML"></aside>

    <main id="main-content" class="main-content">

        <header class="top-header">
            <!-- Saludo según la hora: Spring lo reemplaza por fragments/header :: welcome -->
            <div class="welcome"
                 th:replace="~{fragments/header :: welcome}"
                 hx-get="../fragments/header.html"
                 hx-select=".welcome"
                 hx-trigger="load"
                 hx-swap="outerHTML"></div>
            <div class="header-right">
                <!-- Rol de la sesión: fragments/header :: role -->
                <span class="role-badge"
                      th:replace="~{fragments/header :: role}"
                      hx-get="../fragments/header.html"
                      hx-select=".role-badge"
                      hx-trigger="load"
                      hx-swap="outerHTML"></span>
            </div>
        </header>

        <section class="page-title-section">
            <div>
                <span class="subtitle">MI CUENTA</span>
                <h1>Cambiar mi contraseña</h1>
                <p>Usa al menos 8 caracteres. Necesitas tu contraseña actual para confirmar el cambio.</p>
            </div>
        </section>

        <!-- account/response devuelve este formulario (limpio) y un toast -->
        <form id="password-form" class="card form-card form-narrow" th:fragment="form"
              hx-post="/account/password"
              th:hx-post="@{/account/password}"
              hx-target="this"
              hx-swap="outerHTML">

            <div class="form-grid">
                <div class="field">
                    <label for="currentPassword">Contraseña actual</label>
                    <input id="currentPassword" type="password" name="currentPassword"
                           autocomplete="current-password" required>
                </div>

                <div class="field">
                    <label for="newPassword">Nueva contraseña</label>
                    <input id="newPassword" type="password" name="newPassword" minlength="8" maxlength="72"
                           autocomplete="new-password" required>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmar nueva contraseña</label>
                    <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" maxlength="72"
                           autocomplete="new-password" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i data-lucide="key-round"></i> Actualizar contraseña
                </button>
            </div>
        </form>

    </main>
</div>

</body>
</html>
