<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="../../static/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
</head>
<body hx-headers='{"X-CSRF-TOKEN": "estatico"}'
      th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

<div id="toast-container"></div>

<main class="container">
    <h1>Cambiar mi contraseña</h1>

    <form id="password-form" class="card" th:fragment="form"
          hx-post="/account/password"
          th:hx-post="@{/account/password}"
          hx-target="this"
          hx-swap="outerHTML">

        <div class="field">
            <label for="currentPassword">Contraseña actual</label>
            <input id="currentPassword" type="password" name="currentPassword" required>
        </div>

        <div class="field">
            <label for="newPassword">Nueva contraseña</label>
            <input id="newPassword" type="password" name="newPassword" minlength="8" maxlength="72" required>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirmar nueva contraseña</label>
            <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" maxlength="72" required>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
            <a class="btn" href="../public/index.html" th:href="@{/}">Volver</a>
        </div>
    </form>
</main>

</body>
</html>
