<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar contraseña | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="../../static/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
    <script>
        //Contraseña cambiada: el back envía la cabecera HX-Trigger {"passwordChanged": "<url>"}.
        //Se bloquea el botón (evita un segundo envío) y tras 1,5 s se va a la vista principal del rol
        document.addEventListener('passwordChanged', function (event) {
            document.querySelector('#password-form [type="submit"]').disabled = true;
            setTimeout(function () {
                window.location.href = event.detail.value;
            }, 1500);
        });
    </script>
</head>
<body hx-headers='{"X-CSRF-TOKEN": "estatico"}'
      th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

<div id="toast-container"></div>

<main class="container">
    <h1>Cambiar mi contraseña</h1>

    <!-- hx-swap="none": la respuesta solo trae el toast (oob); si hay error, lo escrito se conserva -->
    <form id="password-form" class="card"
          hx-post="/account/password"
          th:hx-post="@{/account/password}"
          hx-swap="none">

        <div class="field">
            <label for="currentPassword">Contraseña actual</label>
            <input id="currentPassword" type="password" name="currentPassword" required>
        </div>

        <div class="field">
            <label for="newPassword">Nueva contraseña</label>
            <input id="newPassword" type="password" name="newPassword" minlength="8" maxlength="72" required>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirmar nueva contraseña</label>
            <input id="confirmPassword" type="password" name="confirmPassword" minlength="8" maxlength="72" required>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Actualizar contraseña</button>
            <!-- Vista principal del rol (AccountController → SecurityConfig.redirectByRole) -->
            <a class="btn" href="../public/index.html" th:href="@{${homeUrl}}">Volver</a>
        </div>
    </form>
</main>

</body>
</html>
