<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reparaciones | Autogest</title>
    <link rel="stylesheet" href="../../static/css/styles.css" th:href="@{/css/styles.css}">
    <script src="../../static/js/htmx.min.js" th:src="@{/js/htmx.min.js}"></script>
</head>
<body hx-headers='{"X-CSRF-TOKEN": "estatico"}'
      th:hx-headers="|{&quot;${_csrf.headerName}&quot;: &quot;${_csrf.token}&quot;}|">

<div id="toast-container"></div>

<main class="container container-wide">
    <div class="actions">
        <a class="btn" href="../vehicles/list.html" th:href="@{/vehicles}">Vehículos</a>
        <a class="btn" href="../account/change-password.html" th:href="@{/account/password}">Cambiar mi contraseña</a>
        <form method="post" action="/logout" th:action="@{/logout}">
            <button type="submit" class="btn">Cerrar sesión</button>
        </form>
    </div>

    <h1>Reparaciones</h1>

    <form id="repair-form" class="card" th:fragment="form"
          hx-post="/repairs"
          th:hx-post="${repairId == null} ? @{/repairs}"
          th:hx-put="${repairId != null} ? @{/repairs/{id}(id=${repairId})}"
          hx-target="this"
          hx-swap="outerHTML">

        <h2 th:text="${repairId == null} ? 'Nueva reparación' : 'Editar reparación'">Nueva reparación</h2>

        <div class="form-grid">
            <div class="field">
                <label for="vehicleId">Vehículo</label>
                <select id="vehicleId" name="vehicleId" required>
                    <option value=""
                            th:text="${#lists.isEmpty(vehicles)} ? 'No hay vehículos registrados' : 'Seleccione…'">Seleccione…</option>
                    <option th:each="v : ${vehicles}"
                            value="1"
                            th:value="${v.id}"
                            th:text="|${v.licensePlate} — ${v.carModel.brand} ${v.carModel.name}|"
                            th:selected="${v.id == repair.vehicleId}">ABC-123 — Mazda 3</option>
                </select>
            </div>

            <div class="field">
                <label for="mechanicId">Mecánico</label>
                <select id="mechanicId" name="mechanicId" required>
                    <option value=""
                            th:text="${#lists.isEmpty(mechanics)} ? 'No hay mecánicos registrados' : 'Seleccione…'">Seleccione…</option>
                    <option th:each="m : ${mechanics}"
                            value="1"
                            th:value="${m.id}"
                            th:text="${m.fullName}"
                            th:selected="${m.id == repair.mechanicId}">Carlos Ramírez</option>
                </select>
            </div>

            <div class="field">
                <label for="serviceType">Tipo de servicio</label>
                <select id="serviceType" name="serviceType" required>
                    <option value="">Seleccione…</option>
                    <option th:each="t : ${serviceTypes}"
                            value="SERVICE_INTERNAL"
                            th:value="${t}"
                            th:text="${t.label}"
                            th:selected="${t == repair.serviceType}">En el taller</option>
                </select>
            </div>

            <div class="field">
                <label for="latitude">Latitud (solo a domicilio)</label>
                <input id="latitude" type="number" name="latitude" min="-90" max="90" step="0.000001"
                       placeholder="4.711000"
                       value="" th:value="${repair.latitude}">
            </div>

            <div class="field">
                <label for="longitude">Longitud (solo a domicilio)</label>
                <input id="longitude" type="number" name="longitude" min="-180" max="180" step="0.000001"
                       placeholder="-74.072100"
                       value="" th:value="${repair.longitude}">
            </div>

            <div class="field field-full">
                <label for="reason">Motivo</label>
                <textarea id="reason" name="reason" maxlength="500" rows="3" required
                          th:text="${repair.reason}"></textarea>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary"
                    th:text="${repairId == null} ? 'Registrar' : 'Actualizar'">Registrar</button>

            <button type="button" class="btn" th:if="${repairId != null}"
                    hx-get="/repairs/form"
                    th:hx-get="@{/repairs/form}"
                    hx-target="#repair-form"
                    hx-swap="outerHTML">Cancelar</button>
        </div>
    </form>

    <div class="table-wrap">
        <table id="repair-table" class="card table" th:fragment="table" hx-swap-oob="true">
            <thead>
            <tr>
                <th>Fecha</th>
                <th>Placa</th>
                <th>Modelo</th>
                <th>Mecánico</th>
                <th>Motivo</th>
                <th>Servicio</th>
                <th>Estado</th>
                <th>Repuestos</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${repairs}">
                <td th:text="${#temporals.format(r.repairDate, 'dd/MM/yyyy HH:mm')}">20/10/2026 09:30</td>
                <td>
                    <span class="plate plate-COLOR_YELLOW"
                          th:classappend="${'plate-' + r.vehicle.plateColor}"
                          th:text="${r.vehicle.licensePlate}">ABC-123</span>
                </td>
                <td th:text="|${r.vehicle.carModel.brand} ${r.vehicle.carModel.name}|">Mazda 3</td>
                <td th:text="${r.mechanic.fullName}">Carlos Ramírez</td>
                <td th:text="${r.reason}">Revisión de frenos</td>
                <td th:text="${r.serviceType.label}">En el taller</td>
                <td><span class="tag" th:text="${r.status.label}">Pendiente</span></td>
                <td>
                    <span class="tag" th:each="p : ${r.usedParts}"
                          th:text="|${p.key.name} x${p.value}|">Bujía x4</span>
                </td>
                <td class="actions">
                    <!-- Editar y eliminar solo antes de que el mecánico empiece -->
                    <button type="button" class="btn" th:if="${r.status.name() == 'PENDING'}"
                            hx-get="/repairs/1/edit"
                            th:hx-get="@{/repairs/{id}/edit(id=${r.id})}"
                            hx-target="#repair-form"
                            hx-swap="outerHTML">Editar</button>

                    <button type="button" class="btn btn-danger" th:if="${r.status.name() == 'PENDING'}"
                            hx-delete="/repairs/1"
                            th:hx-delete="@{/repairs/{id}(id=${r.id})}"
                            hx-swap="none"
                            hx-confirm="¿Eliminar esta reparación?">Eliminar</button>

                    <button type="button" class="btn btn-primary" th:if="${r.status.name() == 'COMPLETED'}"
                            hx-post="/repairs/1/deliver"
                            th:hx-post="@{/repairs/{id}/deliver(id=${r.id})}"
                            hx-swap="none"
                            th:hx-confirm="|¿Entregar el vehículo ${r.vehicle.licensePlate} al cliente?|">Entregar</button>

                    <button type="button" class="btn btn-danger"
                            th:if="${r.status.name() == 'PENDING' or r.status.name() == 'IN_PROGRESS'}"
                            hx-post="/repairs/1/cancel"
                            th:hx-post="@{/repairs/{id}/cancel(id=${r.id})}"
                            hx-swap="none"
                            hx-confirm="¿Cancelar esta reparación? Los repuestos usados volverán al stock.">Cancelar</button>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(repairs)}">
                <td colspan="9" class="empty">No hay reparaciones registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
