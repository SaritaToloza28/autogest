spring.application.name=autogest
server.port=8080

spring.datasource.username=saritacarolina
spring.datasource.password=1234

spring.mvc.hiddenmethod.filter.enabled=true

#development only database setting


spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:autogestdb;mode=PostgreSQL
spring.jpa.defer-datasource-initialization=true


spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.tomcat.max-swallow-size=20MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

app.admin.username=admin
app.admin.password=12345678


